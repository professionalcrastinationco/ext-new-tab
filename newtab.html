<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bookmarks</title>
    <link rel="stylesheet" href="lib/pico.min.css">
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
    <!-- Google Search Field -->
    <div class="search-container">
        <div class="search-box">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search Google or type a URL"
                autocomplete="off"
            />
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </div>
    </div>

    <!-- Quick Access Links -->
    <div class="quick-links-container" id="quickLinks">
        <!-- Populated by JavaScript -->
    </div>

    <!-- Icon Dock (position determined by settings) -->
    <div class="dock dock-bottom" id="dock"></div>

    <!-- Settings Button -->
    <button class="settings-btn" id="settingsBtn"><span id="settingsIcon"></span></button>

    <!-- Edit Category Modal -->
    <dialog id="category-modal">
        <div class="modal-header">
            <div class="preview-icon" id="category-preview-icon">
                <!-- Icon SVG populated by JavaScript -->
            </div>
            <div class="preview-info">
                <span class="preview-label">Category</span>
                <span class="preview-title" id="category-preview-title">Edit Category</span>
            </div>
            <button class="close-btn" id="close-category-modal" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
            </button>
        </div>
        <form id="category-form">
            <div class="modal-body">
                <div class="field">
                    <label class="field-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
                        Name
                    </label>
                    <input type="text" class="field-input" id="category-name" name="name" placeholder="Work, Personal, etc." required>
                </div>
                <div class="icon-section">
                    <label class="section-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M200,32H56A24,24,0,0,0,32,56V200a24,24,0,0,0,24,24H200a24,24,0,0,0,24-24V56A24,24,0,0,0,200,32Zm8,168a8,8,0,0,1-8,8H56a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H200a8,8,0,0,1,8,8ZM80,80A12,12,0,1,1,92,92,12,12,0,0,1,80,80Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,176,80Zm0,96a12,12,0,1,1-12-12A12,12,0,0,1,176,176Zm-96,0a12,12,0,1,1-12-12A12,12,0,0,1,80,176Z"/></svg>
                        Choose Icon
                    </label>
                    <div class="icon-picker" id="icon-picker">
                        <!-- Icons populated by JavaScript -->
                    </div>
                </div>
                <input type="hidden" id="category-icon" name="icon" value="briefcase">
                <input type="hidden" id="category-id" name="categoryId">
            </div>
            <div class="modal-footer">
                <button type="button" class="delete-btn" id="delete-category-btn" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>
                    Delete
                </button>
                <button type="submit" class="save-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>
                    Save
                </button>
            </div>
        </form>
    </dialog>

    <!-- Edit Bookmark Modal -->
    <dialog id="link-modal">
        <div class="modal-header">
            <div class="preview-favicon" id="link-preview-favicon">
                <img src="" alt="" id="link-preview-img">
            </div>
            <div class="preview-info">
                <span class="preview-label">Bookmark</span>
                <span class="preview-title" id="link-preview-title">Edit Bookmark</span>
            </div>
            <button class="close-btn" id="close-link-modal" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
            </button>
        </div>
        <form id="link-form">
            <div class="modal-body">
                <div class="field">
                    <label class="field-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
                        Title
                    </label>
                    <input type="text" class="field-input" id="link-title" name="title" placeholder="Example Site" required>
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M137.54,186.36a8,8,0,0,1,0,11.31l-9.94,10A56,56,0,0,1,48.38,128.4L72.5,104.28A56,56,0,0,1,149.31,102a8,8,0,1,1-10.64,12,40,40,0,0,0-54.85,1.63L59.7,139.72a40,40,0,0,0,56.58,56.58l9.94-9.94A8,8,0,0,1,137.54,186.36Zm70.08-138a56.08,56.08,0,0,0-79.22,0l-9.94,9.95a8,8,0,0,0,11.32,11.31l9.94-9.94a40,40,0,0,1,56.58,56.58L172.18,140.4A40,40,0,0,1,117.33,142,8,8,0,1,0,106.69,154a56,56,0,0,0,76.81-2.26l24.12-24.12A56.08,56.08,0,0,0,207.62,48.38Z"/></svg>
                        URL
                    </label>
                    <input type="url" class="field-input" id="link-url" name="url" placeholder="https://example.com" required>
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a48,48,0,0,1-96,0,8,8,0,0,1,16,0,32,32,0,0,0,64,0,8,8,0,0,1,16,0Z"/></svg>
                        Category
                    </label>
                    <select class="field-select" id="link-category" name="category" required>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="field checkbox-field">
                    <label class="checkbox-label">
                        <input type="checkbox" id="link-add-quick-link" name="addQuickLink">
                        <span class="checkbox-text">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M197.66,122.34a8,8,0,0,1,0,11.32l-80,80a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L112,196.69l74.34-74.35A8,8,0,0,1,197.66,122.34Zm-169.32,0L68,82.69,102.34,117a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40a8,8,0,0,0,11.32,11.32Z"/></svg>
                            Also add as Quick Link icon
                        </span>
                    </label>
                </div>
                <input type="hidden" id="link-id" name="linkId">
                <input type="hidden" id="link-original-category" name="originalCategory">
            </div>
            <div class="modal-footer">
                <button type="button" class="delete-btn" id="delete-link-btn" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>
                    Delete
                </button>
                <button type="submit" class="save-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>
                    Save
                </button>
            </div>
        </form>
    </dialog>

    <!-- Settings Modal -->
    <dialog id="settings-modal">
        <div class="modal-header">
            <div class="preview-icon settings-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06Zm-16.1-6.5a73.93,73.93,0,0,1,0,8.68,8,8,0,0,0,1.74,5.48l14.19,17.73a91.57,91.57,0,0,1-6.23,15L187,173.11a8,8,0,0,0-5.1,2.64,74.11,74.11,0,0,1-6.14,6.14,8,8,0,0,0-2.64,5.1l-2.51,22.58a91.32,91.32,0,0,1-15,6.23l-17.74-14.19a8,8,0,0,0-5-1.75h-.48a73.93,73.93,0,0,1-8.68,0,8,8,0,0,0-5.48,1.74L100.45,215.8a91.57,91.57,0,0,1-15-6.23L82.89,187a8,8,0,0,0-2.64-5.1,74.11,74.11,0,0,1-6.14-6.14,8,8,0,0,0-5.1-2.64L46.43,170.6a91.32,91.32,0,0,1-6.23-15l14.19-17.74a8,8,0,0,0,1.74-5.48,73.93,73.93,0,0,1,0-8.68,8,8,0,0,0-1.74-5.48L40.2,100.45a91.57,91.57,0,0,1,6.23-15L69,82.89a8,8,0,0,0,5.1-2.64,74.11,74.11,0,0,1,6.14-6.14A8,8,0,0,0,82.89,69L85.4,46.43a91.32,91.32,0,0,1,15-6.23l17.74,14.19a8,8,0,0,0,5.48,1.74,73.93,73.93,0,0,1,8.68,0,8,8,0,0,0,5.48-1.74L155.55,40.2a91.57,91.57,0,0,1,15,6.23L173.11,69a8,8,0,0,0,2.64,5.1,74.11,74.11,0,0,1,6.14,6.14,8,8,0,0,0,5.1,2.64l22.58,2.51a91.32,91.32,0,0,1,6.23,15l-14.19,17.74A8,8,0,0,0,199.87,123.66Z"/></svg>
            </div>
            <div class="preview-info">
                <span class="preview-label">Preferences</span>
                <span class="preview-title">Settings</span>
            </div>
            <button class="close-btn" id="close-settings-modal" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="settings-section">
                <h4>Appearance</h4>
                <div class="setting-item">
                    <label for="dockPositionSelect">Dock Position</label>
                    <select id="dockPositionSelect">
                        <option value="bottom">Bottom</option>
                        <option value="top">Top</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h4>Bookmarks</h4>
                <div class="setting-item">
                    <label for="openInNewTabSelect">Open links in</label>
                    <select id="openInNewTabSelect">
                        <option value="true">New Tab</option>
                        <option value="false">Same Tab</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h4>Categories</h4>
                <button class="manage-btn" id="manageCategoriesBtn">
                    Manage Categories
                </button>
            </div>
        </div>
    </dialog>

    <!-- Confirm Delete Modal -->
    <dialog id="confirm-modal">
        <div class="modal-header">
            <div class="preview-icon danger-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z"/></svg>
            </div>
            <div class="preview-info">
                <span class="preview-label">Confirm Action</span>
                <span class="preview-title">Delete Item</span>
            </div>
        </div>
        <div class="modal-body">
            <p id="confirm-message" style="margin: 0; color: #94a3b8; font-size: 15px; line-height: 1.5;"></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="secondary-btn" id="cancel-confirm-btn">Cancel</button>
            <button type="button" class="confirm-delete" id="confirm-delete-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>
                Delete
            </button>
        </div>
    </dialog>

    <!-- Quick Link Modal -->
    <dialog id="quick-link-modal">
        <div class="modal-header">
            <div class="preview-icon" id="quick-link-preview-icon">
                <!-- Icon SVG populated by JavaScript -->
            </div>
            <div class="preview-info">
                <span class="preview-label" id="quick-link-preview-label">Quick Link</span>
                <span class="preview-title" id="quick-link-preview-title">New Quick Link</span>
            </div>
            <button class="close-btn" id="close-quick-link-modal" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
            </button>
        </div>
        <form id="quick-link-form">
            <div class="modal-body">
                <div class="field">
                    <label class="field-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
                        Title
                    </label>
                    <input type="text" class="field-input" id="quick-link-title" name="title" placeholder="My Site" required>
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M137.54,186.36a8,8,0,0,1,0,11.31l-9.94,10A56,56,0,0,1,48.38,128.4L72.5,104.28A56,56,0,0,1,149.31,102a8,8,0,1,1-10.64,12,40,40,0,0,0-54.85,1.63L59.7,139.72a40,40,0,0,0,56.58,56.58l9.94-9.94A8,8,0,0,1,137.54,186.36Zm70.08-138a56.08,56.08,0,0,0-79.22,0l-9.94,9.95a8,8,0,0,0,11.32,11.31l9.94-9.94a40,40,0,0,1,56.58,56.58L172.18,140.4A40,40,0,0,1,117.33,142,8,8,0,1,0,106.69,154a56,56,0,0,0,76.81-2.26l24.12-24.12A56.08,56.08,0,0,0,207.62,48.38Z"/></svg>
                        URL
                    </label>
                    <input type="url" class="field-input" id="quick-link-url" name="url" placeholder="https://example.com" required>
                </div>
