<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bookmarks</title>
    <link rel="stylesheet" href="lib/pico.min.css">
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
    <!-- Google Search Field -->
    <div class="search-container">
        <div class="search-box">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search Google or type a URL"
                autocomplete="off"
            />
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </div>
    </div>

    <!-- Quick Access Links -->
    <div class="quick-links-container" id="quickLinks">
        <!-- Populated by JavaScript -->
    </div>

    <!-- Icon Dock (position determined by settings) -->
    <div class="dock dock-bottom" id="dock"></div>

    <!-- Settings Button -->
    <button class="settings-btn" id="settingsBtn"><span id="settingsIcon"></span></button>

    <!-- Edit Category Modal -->
    <dialog id="category-modal">
        <article style="max-width: 500px;">
            <header>
                <button aria-label="Close" rel="prev" id="close-category-modal">×</button>
                <h3 id="category-modal-title">Edit Category</h3>
            </header>
            <form id="category-form">
                <label for="category-name">
                    Category Name
                    <input type="text" id="category-name" name="name" placeholder="Work, Personal, etc." required>
                </label>
                <label>
                    Icon
                    <div class="icon-picker" id="icon-picker">
                        <!-- Icons populated by JavaScript -->
                    </div>
                    <input type="hidden" id="category-icon" name="icon" value="briefcase">
                    <small style="color: #94a3b8;">Click to select an icon</small>
                </label>
                <input type="hidden" id="category-id" name="categoryId">
                <footer style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                    <button type="button" class="secondary" id="cancel-category-btn" style="margin: 0;">Cancel</button>
                    <button type="submit" style="margin: 0;">Save</button>
                </footer>
            </form>
        </article>
    </dialog>

    <!-- Edit Bookmark Modal -->
    <dialog id="link-modal">
        <article style="max-width: 500px;">
            <header>
                <button aria-label="Close" rel="prev" id="close-link-modal">×</button>
                <h3 id="link-modal-title">Edit Bookmark</h3>
            </header>
            <form id="link-form">
                <label for="link-url">
                    URL
                    <input type="url" id="link-url" name="url" placeholder="https://example.com" required>
                </label>
                <label for="link-title">
                    Title
                    <input type="text" id="link-title" name="title" placeholder="Example Site" required>
                </label>
                <label for="link-category">
                    Category
                    <select id="link-category" name="category" required>
                        <!-- Populated dynamically -->
                    </select>
                </label>
                <input type="hidden" id="link-id" name="linkId">
                <input type="hidden" id="link-original-category" name="originalCategory">
                <footer style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                    <button type="button" class="secondary" id="cancel-link-btn" style="margin: 0;">Cancel</button>
                    <button type="submit" style="margin: 0;">Save</button>
                </footer>
            </form>
        </article>
    </dialog>

    <!-- Settings Modal -->
    <dialog id="settings-modal">
        <article style="max-width: 500px;">
            <header>
                <button aria-label="Close" rel="prev" id="close-settings-modal">×</button>
                <h3>Settings</h3>
            </header>

            <div class="settings-section">
                <h4>Appearance</h4>
                <div class="setting-item">
                    <label for="dockPositionSelect">Dock Position</label>
                    <select id="dockPositionSelect">
                        <option value="bottom">Bottom</option>
                        <option value="top">Top</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h4>Bookmarks</h4>
                <div class="setting-item">
                    <label for="openInNewTabSelect">Open links in</label>
                    <select id="openInNewTabSelect">
                        <option value="true">New Tab</option>
                        <option value="false">Same Tab</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h4>Categories</h4>
                <button class="manage-categories-btn" id="manageCategoriesBtn">
                    Manage Categories
                </button>
            </div>
        </article>
    </dialog>

    <!-- Confirm Delete Modal -->
    <dialog id="confirm-modal">
        <article style="max-width: 400px;">
            <header>
                <h3>Confirm Delete</h3>
            </header>
            <p id="confirm-message"></p>
            <footer style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                <button type="button" class="secondary" id="cancel-confirm-btn" style="margin: 0;">Cancel</button>
                <button type="button" class="contrast" id="confirm-delete-btn" style="margin: 0;">Delete</button>
            </footer>
        </article>
    </dialog>

    <script src="icons.js"></script>
    <script src="utils.js"></script>
    <script src="storage.js"></script>
    <script src="import-export.js"></script>
    <script src="context-menu.js"></script>
    <script src="newtab.js"></script>
</body>
</html>
