<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookmarks - Dockside</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="brand-tile" aria-hidden="true">
        <svg viewBox="0 0 128 128" fill="currentColor"><path fill-rule="evenodd" d="M64 5.5C68.2435 5.5 72.3129 7.18594 75.3135 10.1865C78.3141 13.1871 80 17.2565 80 21.5C80 25.7435 78.3141 29.8129 75.3135 32.8135C73.7814 34.3456 71.9703 35.5339 70 36.3311V45.5H84C85.3261 45.5 86.5975 46.0272 87.5352 46.9648C88.4728 47.9025 89 49.1739 89 50.5C89 51.8261 88.4728 53.0975 87.5352 54.0352C86.5975 54.9728 85.3261 55.5 84 55.5H70V103.817C80.8435 101.679 88.523 94.8561 91.5 85.5L87 81.5L107 66.5L103.5 89.5C102 107.5 82 116.5 64 122.5C46 116.5 26 107.5 24.5 89.5L21 66.5L41 81.5L36.5 85.5C39.477 94.8561 47.1565 101.679 58 103.817V55.5H44C42.6739 55.5 41.4025 54.9728 40.4648 54.0352C39.5272 53.0975 39 51.8261 39 50.5C39 49.1739 39.5272 47.9025 40.4648 46.9648C41.4025 46.0272 42.6739 45.5 44 45.5H58V36.3311C56.0297 35.5339 54.2186 34.3456 52.6865 32.8135C49.6859 29.8129 48 25.7435 48 21.5C48 17.2565 49.6859 13.1871 52.6865 10.1865C55.6871 7.18594 59.7565 5.5 64 5.5ZM64 13.5C61.8783 13.5 59.8431 14.3425 58.3428 15.8428C56.8425 17.3431 56 19.3783 56 21.5C56 23.6217 56.8425 25.6569 58.3428 27.1572C59.8431 28.6575 61.8783 29.5 64 29.5C66.1217 29.5 68.1569 28.6575 69.6572 27.1572C71.1575 25.6569 72 23.6217 72 21.5C72 19.3783 71.1575 17.3431 69.6572 15.8428C68.1569 14.3425 66.1217 13.5 64 13.5Z"/></svg>
      </span>
      Dockside
    </div>
    <nav class="top-bar-actions" aria-label="Page actions">
      <a href="newtab.html" class="btn btn-ghost">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/>
        </svg>
        <span>Back To Dock</span>
      </a>
      <button type="button" class="btn btn-ghost" id="import-btn">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z"/>
        </svg>
        <span>Import</span>
      </button>
      <button type="button" class="btn btn-ghost" id="export-btn">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/>
        </svg>
        <span>Export</span>
      </button>
      <button type="button" class="btn btn-primary" id="quick-add-btn">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/>
        </svg>
        <span>Quick Add</span>
      </button>
    </nav>
  </header>

  <div class="main-wrapper">
    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title">Manage Bookmarks</h1>
        <p class="page-subtitle">Organize your categories and links</p>
      </header>
      <div id="categories-container" class="categories">
        <!-- Categories rendered by ui.js -->
      </div>
      <button type="button" id="add-category-btn" class="btn btn-secondary add-category">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/>
        </svg>
        Add Category
      </button>
    </main>
  </div>

  <!-- Add/Edit Link Modal -->
  <dialog id="link-modal">
    <div class="modal-header">
      <div class="preview-favicon" id="link-preview-favicon">
        <img src="" alt="" id="link-favicon-img">
      </div>
      <div class="preview-info">
        <span class="preview-label" id="link-preview-label">Bookmark</span>
        <span class="preview-title" id="link-preview-title">New Bookmark</span>
      </div>
      <button class="icon-btn close-btn" aria-label="Close" id="close-link-modal" type="button">
        <svg viewBox="0 0 256 256" fill="currentColor">
          <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
        </svg>
      </button>
    </div>
    <form id="link-form">
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="link-title">
            Title
          </label>
          <input type="text" class="field-input" id="link-title" name="title" placeholder="Example Site" required>
        </div>
        <div class="field">
          <label class="field-label" for="link-url">
            URL
          </label>
          <input type="url" class="field-input" id="link-url" name="url" placeholder="https://example.com" required>
        </div>
        <div class="field">
          <label class="field-label" for="link-category">
            Category
          </label>
          <select class="field-select" id="link-category" name="category" required></select>
        </div>
        <div class="field checkbox-field">
          <label class="checkbox-label">
            <input type="checkbox" id="link-add-quick-link" name="addQuickLink">
            <span class="checkbox-text">Also Add As Quick Link</span>
          </label>
        </div>
        <input type="hidden" id="link-id" name="linkId">
        <input type="hidden" id="link-original-category" name="originalCategory">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-ghost-danger delete-btn" id="delete-link-btn" style="display: none;">
          <svg viewBox="0 0 256 256" fill="currentColor">
            <path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/>
          </svg>
          Delete
        </button>
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary save-btn">
          <svg viewBox="0 0 256 256" fill="currentColor">
            <path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/>
          </svg>
          Save
        </button>
      </div>
    </form>
  </dialog>

  <!-- Category Name Modal -->
  <dialog id="category-modal">
    <div class="modal-header">
      <div class="preview-icon" id="category-preview-icon">
        <!-- Icon SVG populated by JS -->
      </div>
      <div class="preview-info">
        <span class="preview-label" id="category-preview-label">Category</span>
        <span class="preview-title" id="category-preview-title">New Category</span>
      </div>
      <button class="icon-btn close-btn" aria-label="Close" id="close-category-modal" type="button">
        <svg viewBox="0 0 256 256" fill="currentColor">
          <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
        </svg>
      </button>
    </div>
    <form id="category-form">
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="category-name">
            Category Name
          </label>
          <input type="text" class="field-input" id="category-name" name="name" placeholder="Work, Personal, etc." required>
        </div>
        <div class="icon-section">
          <label class="section-label">
            Choose Icon
          </label>
          <div class="icon-picker" id="icon-picker">
            <!-- Icons populated by JavaScript -->
          </div>
          <input type="hidden" id="category-icon" name="icon" value="briefcase">
        </div>
        <input type="hidden" id="category-id" name="categoryId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-ghost-danger delete-btn" id="delete-category-btn" style="display: none;">
          <svg viewBox="0 0 256 256" fill="currentColor">
            <path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/>
          </svg>
          Delete
        </button>
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary save-btn">
          <svg viewBox="0 0 256 256" fill="currentColor">
            <path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/>
          </svg>
          Save
        </button>
      </div>
    </form>
  </dialog>

  <!-- Confirm Delete Modal -->
  <dialog id="confirm-modal">
    <div class="modal-header">
      <div class="preview-icon danger-icon">
        <svg viewBox="0 0 256 256" fill="currentColor">
          <path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/>
        </svg>
      </div>
      <div class="preview-info">
        <span class="preview-label">Confirm Action</span>
        <span class="preview-title">Delete Item</span>
      </div>
    </div>
    <div class="modal-body">
      <p id="confirm-message" class="confirm-message"></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" id="cancel-confirm-btn">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </dialog>

  <!-- Import File Input (hidden) -->
  <input type="file" id="import-file-input" accept="application/json" style="display: none;">

  <script src="icons.js"></script>
  <script src="custom-icons.js"></script>
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="import-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
