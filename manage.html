<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories - Quick Bookmarks</title>
  <link rel="stylesheet" href="lib/pico.min.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="manage.css">
  <style>
    /* Override Pico CSS defaults with design tokens */
    :root {
      --pico-background-color: var(--color-base);
      --pico-card-background-color: var(--glass-bg-light);
      --pico-muted-border-color: var(--color-border);
    }
    body {
      background-color: var(--color-base);
    }
  </style>
</head>
<body>
  <nav class="floating-toolbar">
    <a href="newtab.html" class="toolbar-btn">
      <svg viewBox="0 0 256 256" width="18" height="18">
        <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z" fill="currentColor"/>
      </svg>
      Dock
    </a>
    <div class="toolbar-divider"></div>
    <button class="toolbar-btn primary" id="quick-add-btn">
      <svg viewBox="0 0 256 256" width="18" height="18">
        <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z" fill="currentColor"/>
      </svg>
      Quick Add
    </button>
    <div class="toolbar-divider"></div>
    <button class="toolbar-btn" id="import-btn">
      <svg viewBox="0 0 256 256" width="18" height="18">
        <path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z" fill="currentColor"/>
      </svg>
      Import
    </button>
    <button class="toolbar-btn" id="export-btn">
      <svg viewBox="0 0 256 256" width="18" height="18">
        <path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z" fill="currentColor"/>
      </svg>
      Export
    </button>
  </nav>

  <div class="main-wrapper">
    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title">Manage Bookmarks</h1>
        <p class="page-subtitle">Organize your categories and links</p>
      </header>
      <div id="categories-container" class="categories">
        <!-- Categories rendered by ui.js -->
      </div>
      <button id="add-category-btn" class="add-category">
        <svg viewBox="0 0 256 256" width="20" height="20">
          <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z" fill="currentColor"/>
        </svg>
        Add New Category
      </button>
    </main>
  </div>

  <!-- Add/Edit Link Modal -->
  <dialog id="link-modal">
    <article>
      <header>
        <button aria-label="Close" rel="prev" id="close-link-modal"></button>
        <h3 id="link-modal-title">Add Link</h3>
      </header>
      <form id="link-form">
        <label for="link-url">
          URL
          <input type="url" id="link-url" name="url" placeholder="https://example.com" required>
        </label>
        <label for="link-title">
          Title
          <input type="text" id="link-title" name="title" placeholder="Example Site" required>
        </label>
        <label for="link-category">
          Category
          <select id="link-category" name="category" required>
            <!-- Populated dynamically -->
          </select>
        </label>
        <input type="hidden" id="link-id" name="linkId">
        <input type="hidden" id="link-original-category" name="originalCategory">
        <footer>
          <button type="button" class="secondary" id="cancel-link-btn">Cancel</button>
          <button type="submit">Save</button>
        </footer>
      </form>
    </article>
  </dialog>

  <!-- Category Name Modal -->
  <dialog id="category-modal">
    <article>
      <header>
        <button aria-label="Close" rel="prev" id="close-category-modal"></button>
        <h3 id="category-modal-title">Add Category</h3>
      </header>
      <form id="category-form">
        <label for="category-name">
          Category Name
          <input type="text" id="category-name" name="name" placeholder="Work, Personal, etc." required>
        </label>
        <label>
          Icon
          <div class="icon-picker" id="icon-picker">
            <!-- Icons populated by JavaScript -->
          </div>
          <input type="hidden" id="category-icon" name="icon" value="briefcase">
          <small>Click to select an icon</small>
        </label>
        <input type="hidden" id="category-id" name="categoryId">
        <footer>
          <button type="button" class="secondary" id="cancel-category-btn">Cancel</button>
          <button type="submit">Save</button>
        </footer>
      </form>
    </article>
  </dialog>

  <!-- Confirm Delete Modal -->
  <dialog id="confirm-modal">
    <article>
      <header>
        <h3>Confirm Delete</h3>
      </header>
      <p id="confirm-message"></p>
      <footer>
        <button type="button" class="secondary" id="cancel-confirm-btn">Cancel</button>
        <button type="button" class="contrast" id="confirm-delete-btn">Delete</button>
      </footer>
    </article>
  </dialog>

  <!-- Import File Input (hidden) -->
  <input type="file" id="import-file-input" accept="application/json" style="display: none;">

  <script src="icons.js"></script>
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="import-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
