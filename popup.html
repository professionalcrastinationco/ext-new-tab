<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to Dockside</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Brand header -->
  <header class="brand-header">
    <span class="brand-tile" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
        <path d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.24,6.78L128,193.43l59.77,37.35A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Zm0,177.57-51.77-32.35a8,8,0,0,0-8.48,0L72,209.57V48H184Z"/>
      </svg>
    </span>
    <span class="brand-name">Dockside</span>
    <button type="button" class="icon-btn" id="cancel-btn" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
        <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
      </svg>
    </button>
  </header>

  <!-- Main Bookmark Card -->
  <div id="bookmark-card" class="bookmark-card">
    <div class="card-header">
      <div class="page-favicon">
        <img id="favicon" src="" alt="">
      </div>
      <div class="page-info">
        <div class="page-title" id="page-title-display"></div>
        <div class="page-url" id="page-url-display"></div>
      </div>
    </div>

    <form id="bookmark-form">
      <div id="message" class="message"></div>

      <div class="field">
        <label class="field-label" for="title">Title</label>
        <input type="text" id="title" name="title" class="field-input" required>
      </div>

      <div class="field">
        <label class="field-label" for="category">Category</label>
        <select id="category" name="category" class="field-select" required>
          <option value="">Loading...</option>
        </select>
      </div>

      <!-- Hidden URL field -->
      <input type="hidden" id="url" name="url">

      <label class="checkbox-label">
        <input type="checkbox" id="openInNewTab" name="openInNewTab" checked>
        Open In New Tab
      </label>

      <button type="submit" class="btn btn-primary save-btn" id="save-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
          <path d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.24,6.78L128,193.43l59.77,37.35A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Zm0,177.57-51.77-32.35a8,8,0,0,0-8.48,0L72,209.57V48H184Z"/>
        </svg>
        Save Bookmark
      </button>
    </form>
  </div>

  <!-- Cannot bookmark this page (Chrome system pages) -->
  <div id="unsupported-state" class="empty-state" hidden>
    <span class="empty-state-icon warning" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
        <path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z"/>
      </svg>
    </span>
    <h2 class="empty-state-title">Cannot Bookmark This Page</h2>
    <p>Chrome system pages cannot be saved. Open a regular website and try again.</p>
  </div>

  <!-- Empty State (no categories yet) -->
  <div id="empty-state" class="empty-state" hidden>
    <span class="empty-state-icon" id="empty-icon" aria-hidden="true"></span>
    <h2 class="empty-state-title">No Categories Yet</h2>
    <p><a href="#" id="open-newtab-empty">Open the new tab page</a> to create a category first.</p>
  </div>

  <!-- Footer actions -->
  <div class="quick-actions">
    <a href="newtab.html" class="btn btn-ghost quick-action" id="open-newtab">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
        <path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z"/>
      </svg>
      Settings
    </a>
    <a href="manage.html" class="btn btn-ghost quick-action" id="open-manage" target="_blank">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
        <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM40,56H80V200H40ZM216,200H96V56H216V200Z"/>
      </svg>
      Manage
    </a>
  </div>

  <script src="icons.js"></script>
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
