<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Mockup 2: Sidebar Layout</title>
  <style>
    :root {
      --color-base: #0f172a;
      --color-surface-1: rgba(30, 41, 59, 0.6);
      --color-surface-2: rgba(30, 41, 59, 0.8);
      --color-surface-3: rgba(51, 65, 85, 0.5);
      --color-border: rgba(148, 163, 184, 0.2);
      --color-border-focus: rgba(6, 182, 212, 0.5);
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-text-subtle: #64748b;
      --color-primary: #0ea5e9;
      --color-primary-hover: #0284c7;
      --color-accent: #22d3ee;
      --glass-blur: 20px;
      --glass-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 2px 2px rgb(0 0 0 / 3%), 0 4px 4px rgb(0 0 0 / 4%),
        0 10px 8px rgb(0 0 0 / 5%), 0 15px 15px rgb(0 0 0 / 6%),
        0 30px 30px rgb(0 0 0 / 7%), 0 70px 65px rgb(0 0 0 / 9%);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--color-base);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--color-text);
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      backdrop-filter: blur(var(--glass-blur));
      border-right: 1px solid var(--color-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--color-border);
    }

    .sidebar-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Sidebar Navigation */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      font-size: 14px;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--color-text);
    }

    .nav-item.active {
      background: rgba(14, 165, 233, 0.15);
      color: var(--color-primary);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .nav-divider {
      height: 1px;
      background: var(--color-border);
      margin: 12px 0;
    }

    /* Sidebar Actions */
    .sidebar-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    .btn-secondary {
      background: var(--color-surface-1);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background: var(--color-surface-2);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 32px 40px;
      overflow-y: auto;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--color-surface-1);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--color-border);
      border-radius: 50px;
      width: 280px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--color-text);
      font-size: 14px;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--color-text-subtle);
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      fill: var(--color-text-subtle);
    }

    /* Categories Grid */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
    }

    .category-card {
      background: linear-gradient(45deg, rgba(10, 20, 28, 0.3) 0%, rgba(10, 20, 28, 0.8) 100%);
      backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--radius-lg);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(51, 65, 85, 0.2);
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-icon {
      width: 28px;
      height: 28px;
      background: rgba(34, 211, 238, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-accent);
    }

    .category-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .category-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .category-count {
      font-size: 12px;
      color: var(--color-text-muted);
      background: rgba(148, 163, 184, 0.15);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .category-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Links List */
    .links-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(51, 65, 85, 0.2);
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .link-item:hover {
      background: rgba(51, 65, 85, 0.4);
      transform: translateX(4px);
    }

    .link-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--color-surface-3);
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-url {
      font-size: 11px;
      color: var(--color-text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      background: transparent;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .link-add-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
      background: rgba(34, 211, 238, 0.05);
    }

    .link-add-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Add Category Card */
    .add-category-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      background: rgba(51, 65, 85, 0.15);
      border: 2px dashed rgba(148, 163, 184, 0.25);
      border-radius: var(--radius-lg);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-category-card:hover {
      border-color: var(--color-accent);
      color: var(--color-text);
      background: rgba(51, 65, 85, 0.25);
    }

    .add-category-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .add-category-content svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .design-label {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-primary);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
