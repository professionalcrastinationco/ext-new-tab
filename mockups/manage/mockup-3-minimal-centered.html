<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Mockup 3: Minimal Centered</title>
  <style>
    :root {
      --color-base: #0f172a;
      --color-surface-1: rgba(30, 41, 59, 0.6);
      --color-surface-2: rgba(30, 41, 59, 0.8);
      --color-surface-3: rgba(51, 65, 85, 0.5);
      --color-border: rgba(148, 163, 184, 0.2);
      --color-border-focus: rgba(6, 182, 212, 0.5);
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-text-subtle: #64748b;
      --color-primary: #0ea5e9;
      --color-primary-hover: #0284c7;
      --color-accent: #22d3ee;
      --glass-blur: 20px;
      --glass-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 2px 2px rgb(0 0 0 / 3%), 0 4px 4px rgb(0 0 0 / 4%),
        0 10px 8px rgb(0 0 0 / 5%), 0 15px 15px rgb(0 0 0 / 6%),
        0 30px 30px rgb(0 0 0 / 7%), 0 70px 65px rgb(0 0 0 / 9%);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-pill: 50px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--color-base);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--color-text);
    }

    /* Floating Toolbar - Like newtab search */
    .floating-toolbar {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--color-surface-1);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      box-shadow: var(--glass-shadow);
      z-index: 100;
    }

    .toolbar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      color: var(--color-text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .toolbar-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .toolbar-btn.primary {
      background: var(--color-primary);
      color: white;
    }

    .toolbar-btn.primary:hover {
      background: var(--color-primary-hover);
    }

    .toolbar-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--color-border);
    }

    /* Main Content - Vertically Centered */
    .main-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 100px 24px 40px;
    }

    .main-content {
      width: 100%;
      max-width: 700px;
    }

    /* Page Title */
    .page-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 300;
      color: var(--color-text);
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-top: 8px;
    }

    /* Category List - Accordion Style */
    .categories {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .category {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.4) 0%, rgba(30, 41, 59, 0.7) 100%);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .category:hover {
      border-color: rgba(148, 163, 184, 0.35);
    }

    .category.expanded {
      box-shadow: var(--glass-shadow);
    }

    .category-header {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .category-header:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .category-expand {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      color: var(--color-text-subtle);
      transition: transform 0.3s ease;
    }

    .category.expanded .category-expand {
      transform: rotate(90deg);
    }

    .category-expand svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .category-icon {
      width: 36px;
      height: 36px;
      background: rgba(34, 211, 238, 0.1);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      color: var(--color-accent);
    }

    .category-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .category-info {
      flex: 1;
    }

    .category-name {
      font-size: 1rem;
      font-weight: 500;
    }

    .category-meta {
      font-size: 12px;
      color: var(--color-text-subtle);
      margin-top: 2px;
    }

    .category-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .category-header:hover .category-actions {
      opacity: 1;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Links Content */
    .category-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .category.expanded .category-content {
      max-height: 500px;
    }

    .links-list {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(51, 65, 85, 0.25);
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .link-item:hover {
      background: rgba(51, 65, 85, 0.45);
    }

    .link-drag {
      color: var(--color-text-subtle);
      cursor: move;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .link-item:hover .link-drag {
      opacity: 1;
    }

    .link-favicon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--color-surface-3);
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-url {
      font-size: 11px;
      color: var(--color-text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .link-item:hover .link-actions {
      opacity: 1;
    }

    .link-actions .icon-btn {
      width: 28px;
      height: 28px;
    }

    .link-actions .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Add Link Button */
    .add-link-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: var(--color-text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: color 0.2s ease;
      gap: 6px;
    }

    .add-link-row:hover {
      color: var(--color-accent);
    }

    .add-link-row svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Add Category */
    .add-category {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      background: transparent;
      border: 2px dashed rgba(148, 163, 184, 0.2);
      border-radius: var(--radius-lg);
      color: var(--color-text-muted);
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-category:hover {
      border-color: var(--color-accent);
      color: var(--color-text);
      background: rgba(34, 211, 238, 0.03);
    }

    .add-category svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .design-label {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-primary);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
