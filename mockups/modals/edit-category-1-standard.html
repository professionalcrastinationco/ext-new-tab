<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Category Mockup 1: Standard Dialog</title>
  <style>
    :root {
      --color-base: #0f172a;
      --color-surface-1: rgba(30, 41, 59, 0.6);
      --color-surface-2: rgba(30, 41, 59, 0.95);
      --color-surface-3: rgba(51, 65, 85, 0.5);
      --color-border: rgba(148, 163, 184, 0.2);
      --color-border-focus: rgba(6, 182, 212, 0.5);
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-text-subtle: #64748b;
      --color-primary: #0ea5e9;
      --color-primary-hover: #0284c7;
      --color-accent: #22d3ee;
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;
      --glass-blur: 20px;
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--color-base);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    /* Modal Dialog */
    .modal {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--color-surface-2);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }

    /* Modal Header */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--color-border);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .close-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Modal Body */
    .modal-body {
      padding: 24px;
    }

    /* Form Field */
    .field {
      margin-bottom: 20px;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    .field-input:focus {
      background: rgba(51, 65, 85, 0.7);
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    /* Icon Picker */
    .icon-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      padding: 12px;
      background: rgba(51, 65, 85, 0.3);
      border-radius: var(--radius-md);
      max-height: 180px;
      overflow-y: auto;
    }

    .icon-option {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-option:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .icon-option.selected {
      border-color: var(--color-accent);
      background: rgba(34, 211, 238, 0.1);
      color: var(--color-accent);
    }

    .icon-option svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Modal Footer */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-top: 1px solid var(--color-border);
      background: rgba(51, 65, 85, 0.2);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-danger {
      background: transparent;
      color: var(--color-danger);
      padding: 10px 16px;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-danger svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.8);
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    /* Design Label */
    .design-label {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-primary);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
