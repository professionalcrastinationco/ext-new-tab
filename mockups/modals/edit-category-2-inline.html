<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Category Mockup 2: Inline Expandable</title>
  <style>
    :root {
      --color-base: #0f172a;
      --color-surface-1: rgba(30, 41, 59, 0.6);
      --color-surface-2: rgba(30, 41, 59, 0.95);
      --color-surface-3: rgba(51, 65, 85, 0.5);
      --color-border: rgba(148, 163, 184, 0.2);
      --color-border-focus: rgba(6, 182, 212, 0.5);
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-text-subtle: #64748b;
      --color-primary: #0ea5e9;
      --color-primary-hover: #0284c7;
      --color-accent: #22d3ee;
      --color-danger: #ef4444;
      --glass-blur: 20px;
      --glass-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 2px 2px rgb(0 0 0 / 3%), 0 4px 4px rgb(0 0 0 / 4%),
        0 10px 8px rgb(0 0 0 / 5%), 0 15px 15px rgb(0 0 0 / 6%),
        0 30px 30px rgb(0 0 0 / 7%), 0 70px 65px rgb(0 0 0 / 9%);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--color-base);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--color-text);
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    /* Category Card - Normal State */
    .category {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.4) 0%, rgba(30, 41, 59, 0.7) 100%);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .category.editing {
      border-color: var(--color-accent);
      box-shadow: var(--glass-shadow);
    }

    .category-header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      cursor: pointer;
    }

    .category-icon {
      width: 40px;
      height: 40px;
      background: rgba(34, 211, 238, 0.1);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      color: var(--color-accent);
    }

    .category-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .category-info {
      flex: 1;
    }

    .category-name {
      font-size: 1rem;
      font-weight: 500;
    }

    .category-meta {
      font-size: 12px;
      color: var(--color-text-subtle);
      margin-top: 2px;
    }

    .category-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Inline Edit Panel */
    .edit-panel {
      border-top: 1px solid var(--color-border);
      background: rgba(51, 65, 85, 0.2);
      padding: 20px;
    }

    .edit-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .edit-field {
      flex: 1;
    }

    .edit-field.icon-field {
      flex: 0 0 auto;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.1);
    }

    /* Compact Icon Picker */
    .icon-selector {
      position: relative;
    }

    .icon-current {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-accent);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-current:hover {
      border-color: var(--color-accent);
    }

    .icon-current svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .icon-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 10px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    .icon-dropdown-item {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-dropdown-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
    }

    .icon-dropdown-item.selected {
      background: rgba(34, 211, 238, 0.15);
      color: var(--color-accent);
    }

    .icon-dropdown-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Edit Actions */
    .edit-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-danger {
      background: transparent;
      color: var(--color-danger);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-danger svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text-muted);
    }

    .btn-secondary:hover {
      color: var(--color-text);
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
    }

    /* Design Label */
    .design-label {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-primary);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 11px;
      font-weight: 600;
    }

    .note {
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(14, 165, 233, 0.3);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--color-text-muted);
    }
  </style>
</head>
