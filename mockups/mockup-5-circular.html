<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bookmarks - Mockup 5: Circular Hub</title>

    <!-- Pico CSS for base styling and color variables -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); /* Slate-800 to Slate-950 */
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Central hub container */
        .hub-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        /* Central hub icon */
        .hub-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); /* Blue-500 to Cyan-500 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .hub-center:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 60px rgba(6, 182, 212, 0.8);
        }

        .hub-center::after {
            content: '⊕';
            font-size: 3rem;
        }

        /* Category icons arranged in circle */
        .category-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70px;
            height: 70px;
            margin-left: -35px;
            margin-top: -35px;
            cursor: pointer;
            opacity: 0;
            transform: translate(0, 0) scale(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .hub-container:hover .category-icon {
            opacity: 1;
            pointer-events: all;
        }

        /* Calculate circular positions using CSS variables */
        .category-icon:nth-child(2) {
            --angle: 0deg;
            transition-delay: 0ms;
        }

        .category-icon:nth-child(3) {
            --angle: 72deg;
            transition-delay: 50ms;
        }

        .category-icon:nth-child(4) {
            --angle: 144deg;
            transition-delay: 100ms;
        }

        .category-icon:nth-child(5) {
            --angle: 216deg;
            transition-delay: 150ms;
        }

        .category-icon:nth-child(6) {
            --angle: 288deg;
            transition-delay: 200ms;
        }

        .hub-container:hover .category-icon {
            transform:
                rotate(var(--angle))
                translateX(180px)
                rotate(calc(-1 * var(--angle)))
                scale(1);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%); /* Blue-500 to Jade-500 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .category-icon:hover .icon-circle {
            transform: scale(1.15);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.6);
        }

        /* Connection lines (optional visual effect) */
        .connection-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 2px;
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.3) 0%, rgba(6, 182, 212, 0) 100%);
            transform-origin: left center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .hub-container:hover .connection-line {
            opacity: 1;
        }

        .connection-line:nth-child(7) { transform: rotate(0deg); transition-delay: 0ms; }
        .connection-line:nth-child(8) { transform: rotate(72deg); transition-delay: 50ms; }
        .connection-line:nth-child(9) { transform: rotate(144deg); transition-delay: 100ms; }
        .connection-line:nth-child(10) { transform: rotate(216deg); transition-delay: 150ms; }
        .connection-line:nth-child(11) { transform: rotate(288deg); transition-delay: 200ms; }

        /* Tippy.js custom theme for bookmark popovers */
        .tippy-box[data-theme~='bookmarks-circular'] {
            background-color: #1e293b; /* Slate-800 */
            border: 1px solid #334155; /* Slate-700 */
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.4);
        }

        .tippy-box[data-theme~='bookmarks-circular'][data-placement^='top'] > .tippy-arrow::before {
            border-top-color: #1e293b;
        }

        .tippy-box[data-theme~='bookmarks-circular'][data-placement^='bottom'] > .tippy-arrow::before {
            border-bottom-color: #1e293b;
        }

        .tippy-box[data-theme~='bookmarks-circular'][data-placement^='left'] > .tippy-arrow::before {
            border-left-color: #1e293b;
        }

        .tippy-box[data-theme~='bookmarks-circular'][data-placement^='right'] > .tippy-arrow::before {
            border-right-color: #1e293b;
        }

        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            padding: 1rem;
            min-width: 300px;
            max-width: 380px;
        }

        .category-header {
            grid-column: 1 / -1;
            font-size: 1rem;
            font-weight: 600;
            color: #06b6d4; /* Cyan-500 */
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #334155;
        }

        .bookmark-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background-color: #334155; /* Slate-700 */
            border-radius: 8px;
            color: #f1f5f9;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .bookmark-link:hover {
            background-color: #10b981; /* Jade-500 */
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .bookmark-favicon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .bookmark-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="hub-container" id="hubContainer">
        <div class="hub-center"></div>
    </div>

    <!-- Tippy.js and Popper.js -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>

    <script>
        // Sample data
        const categories = [
            {
                id: 'work',
                name: 'Work',
                icon: '💼',
                bookmarks: [
                    { title: 'Gmail', url: 'https://mail.google.com' },
                    { title: 'Google Calendar', url: 'https://calendar.google.com' },
                    { title: 'Slack', url: 'https://slack.com' },
                    { title: 'Notion', url: 'https://notion.so' },
                    { title: 'Linear', url: 'https://linear.app' },
                    { title: 'Figma', url: 'https://figma.com' }
                ]
            },
            {
                id: 'dev',
                name: 'Dev Tools',
                icon: '⚙️',
                bookmarks: [
                    { title: 'GitHub', url: 'https://github.com' },
                    { title: 'Stack Overflow', url: 'https://stackoverflow.com' },
                    { title: 'CodePen', url: 'https://codepen.io' },
                    { title: 'MDN', url: 'https://developer.mozilla.org' },
                    { title: 'npm', url: 'https://npmjs.com' },
                    { title: 'Vercel', url: 'https://vercel.com' },
                    { title: 'Railway', url: 'https://railway.app' }
                ]
            },
            {
                id: 'social',
                name: 'Social',
                icon: '👥',
                bookmarks: [
                    { title: 'Twitter', url: 'https://twitter.com' },
                    { title: 'LinkedIn', url: 'https://linkedin.com' },
                    { title: 'Reddit', url: 'https://reddit.com' },
                    { title: 'Hacker News', url: 'https://news.ycombinator.com' }
                ]
            },
            {
                id: 'reading',
                name: 'Reading',
                icon: '📚',
                bookmarks: [
                    { title: 'Medium', url: 'https://medium.com' },
                    { title: 'Dev.to', url: 'https://dev.to' },
                    { title: 'Substack', url: 'https://substack.com' }
                ]
            },
            {
                id: 'media',
                name: 'Entertainment',
                icon: '🎬',
                bookmarks: [
                    { title: 'YouTube', url: 'https://youtube.com' },
                    { title: 'Netflix', url: 'https://netflix.com' },
                    { title: 'Spotify', url: 'https://spotify.com' },
                    { title: 'Twitch', url: 'https://twitch.tv' }
                ]
            }
        ];

        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
            } catch {
                return '';
            }
        }

        function createBookmarkGrid(category) {
            const grid = document.createElement('div');
            grid.className = 'bookmark-grid';

            const header = document.createElement('div');
            header.className = 'category-header';
            header.textContent = category.name;
            grid.appendChild(header);

            category.bookmarks.forEach(bookmark => {
                const link = document.createElement('a');
                link.className = 'bookmark-link';
                link.href = bookmark.url;
                link.target = '_blank';

                const favicon = document.createElement('img');
                favicon.className = 'bookmark-favicon';
                favicon.src = getFaviconUrl(bookmark.url);
                favicon.alt = '';

                const title = document.createElement('span');
                title.className = 'bookmark-title';
                title.textContent = bookmark.title;

                link.appendChild(favicon);
                link.appendChild(title);
                grid.appendChild(link);
            });

            return grid;
        }

        function initializeCircularHub() {
            const container = document.getElementById('hubContainer');

            // Add connection lines
            categories.forEach(() => {
                const line = document.createElement('div');
                line.className = 'connection-line';
                container.appendChild(line);
            });

            // Add category icons
            categories.forEach((category, index) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category-icon';

                const iconCircle = document.createElement('div');
                iconCircle.className = 'icon-circle';
                iconCircle.textContent = category.icon;

                categoryDiv.appendChild(iconCircle);
                container.appendChild(categoryDiv);

                // Initialize Tippy.js for bookmark popover on category hover
                tippy(categoryDiv, {
                    content: createBookmarkGrid(category),
                    theme: 'bookmarks-circular',
                    interactive: true,
                    delay: [100, 100],
                    animation: 'fade',
                    duration: [200, 150],
                    placement: 'right',
                    arrow: true,
                    maxWidth: 'none',
                    allowHTML: true,
                    // Only show when categories are visible
                    onShow(instance) {
                        const categoryIcon = instance.reference;
                        return window.getComputedStyle(categoryIcon).opacity !== '0';
                    }
                });
            });
        }

        initializeCircularHub();
    </script>
</body>
</html>
