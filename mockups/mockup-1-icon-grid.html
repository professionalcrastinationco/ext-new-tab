<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bookmarks - Mockup 1: Icon Grid Central</title>

    <!-- Pico CSS for base styling and color variables -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a; /* Slate-950 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3rem;
            padding: 2rem;
        }

        .category-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: transform 0.2s ease-out;
        }

        .category-icon:hover {
            transform: translateY(-4px);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); /* Blue-500 to Cyan-500 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .category-icon:hover .icon-circle {
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.5);
            background: linear-gradient(135deg, #60a5fa 0%, #22d3ee 100%);
        }

        .category-name {
            font-size: 0.875rem;
            color: #94a3b8; /* Slate-400 */
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .category-icon:hover .category-name {
            opacity: 1;
        }

        /* Tippy.js custom theme */
        .tippy-box[data-theme~='bookmarks'] {
            background-color: #1e293b; /* Slate-800 */
            border: 1px solid #334155; /* Slate-700 */
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .tippy-box[data-theme~='bookmarks'][data-placement^='top'] > .tippy-arrow::before {
            border-top-color: #1e293b;
        }

        .tippy-box[data-theme~='bookmarks'][data-placement^='bottom'] > .tippy-arrow::before {
            border-bottom-color: #1e293b;
        }

        .tippy-box[data-theme~='bookmarks'][data-placement^='left'] > .tippy-arrow::before {
            border-left-color: #1e293b;
        }

        .tippy-box[data-theme~='bookmarks'][data-placement^='right'] > .tippy-arrow::before {
            border-right-color: #1e293b;
        }

        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            padding: 1rem;
            min-width: 320px;
            max-width: 400px;
        }

        .bookmark-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background-color: #334155; /* Slate-700 */
            border-radius: 8px;
            color: #f1f5f9; /* Slate-100 */
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .bookmark-link:hover {
            background-color: #06b6d4; /* Cyan-500 */
            transform: translateX(4px);
        }

        .bookmark-favicon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .bookmark-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="icon-grid" id="iconGrid"></div>

    <!-- Tippy.js and Popper.js -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>

    <script>
        // Sample data - consistent across all mockups
        const categories = [
            {
                id: 'work',
                name: 'Work',
                icon: '💼',
                bookmarks: [
                    { title: 'Gmail', url: 'https://mail.google.com' },
                    { title: 'Google Calendar', url: 'https://calendar.google.com' },
                    { title: 'Slack', url: 'https://slack.com' },
                    { title: 'Notion', url: 'https://notion.so' },
                    { title: 'Linear', url: 'https://linear.app' },
                    { title: 'Figma', url: 'https://figma.com' }
                ]
            },
            {
                id: 'dev',
                name: 'Dev Tools',
                icon: '⚙️',
                bookmarks: [
                    { title: 'GitHub', url: 'https://github.com' },
                    { title: 'Stack Overflow', url: 'https://stackoverflow.com' },
                    { title: 'CodePen', url: 'https://codepen.io' },
                    { title: 'MDN', url: 'https://developer.mozilla.org' },
                    { title: 'npm', url: 'https://npmjs.com' },
                    { title: 'Vercel', url: 'https://vercel.com' },
                    { title: 'Railway', url: 'https://railway.app' }
                ]
            },
            {
                id: 'social',
                name: 'Social',
                icon: '👥',
                bookmarks: [
                    { title: 'Twitter', url: 'https://twitter.com' },
                    { title: 'LinkedIn', url: 'https://linkedin.com' },
                    { title: 'Reddit', url: 'https://reddit.com' },
                    { title: 'Hacker News', url: 'https://news.ycombinator.com' }
                ]
            },
            {
                id: 'reading',
                name: 'Reading',
                icon: '📚',
                bookmarks: [
                    { title: 'Medium', url: 'https://medium.com' },
                    { title: 'Dev.to', url: 'https://dev.to' },
                    { title: 'Substack', url: 'https://substack.com' }
                ]
            },
            {
                id: 'media',
                name: 'Entertainment',
                icon: '🎬',
                bookmarks: [
                    { title: 'YouTube', url: 'https://youtube.com' },
                    { title: 'Netflix', url: 'https://netflix.com' },
                    { title: 'Spotify', url: 'https://spotify.com' },
                    { title: 'Twitch', url: 'https://twitch.tv' }
                ]
            }
        ];

        // Get favicon URL using Google's service
        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
            } catch {
                return '';
            }
        }

        // Create bookmark grid HTML
        function createBookmarkGrid(bookmarks) {
            const grid = document.createElement('div');
            grid.className = 'bookmark-grid';

            bookmarks.forEach(bookmark => {
                const link = document.createElement('a');
                link.className = 'bookmark-link';
                link.href = bookmark.url;
                link.target = '_blank';

                const favicon = document.createElement('img');
                favicon.className = 'bookmark-favicon';
                favicon.src = getFaviconUrl(bookmark.url);
                favicon.alt = '';

                const title = document.createElement('span');
                title.className = 'bookmark-title';
                title.textContent = bookmark.title;

                link.appendChild(favicon);
                link.appendChild(title);
                grid.appendChild(link);
            });

            return grid;
        }

        // Initialize the icon grid
        function initializeGrid() {
            const gridContainer = document.getElementById('iconGrid');

            categories.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category-icon';

                const iconCircle = document.createElement('div');
                iconCircle.className = 'icon-circle';
                iconCircle.textContent = category.icon;

                const categoryName = document.createElement('div');
                categoryName.className = 'category-name';
                categoryName.textContent = category.name;

                categoryDiv.appendChild(iconCircle);
                categoryDiv.appendChild(categoryName);
                gridContainer.appendChild(categoryDiv);

                // Initialize Tippy.js with interactive mode
                tippy(categoryDiv, {
                    content: createBookmarkGrid(category.bookmarks),
                    theme: 'bookmarks',
                    interactive: true, // Critical for stable hover behavior
                    delay: [150, 100], // 150ms show delay, 100ms hide delay
                    animation: 'fade',
                    duration: [200, 150],
                    placement: 'bottom',
                    arrow: true,
                    maxWidth: 'none',
                    allowHTML: true
                });
            });
        }

        // Initialize when DOM is ready
        initializeGrid();
    </script>
</body>
</html>
